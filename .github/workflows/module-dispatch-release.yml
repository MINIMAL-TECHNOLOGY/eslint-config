name: Dispatch NPM Release

on:
  workflow_dispatch:
    inputs:
      module:
        type: choice
        description: Build Mode (common|node|react|next|react-native)
        options:
          - common
          - node
          - react
          - next
          - react-native

      build_mode:
        type: choice
        description: Build Mode (patch | minor | major | prepatch | preminor | premajor | prerelease)
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease

env:
  MODULE: ${{ github.event.inputs.module }}
  BUILD_MODE: ${{ github.event.inputs.build_mode }}

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Git
        run: |
          git config user.name "mt-ci gh-action"
          git config user.email "mt-ci@gh-action.none"

      - name: Setup npm registry auth
        # bun publish reads ~/.npmrc directly (it does not support
        # setup-node's NPM_CONFIG_USERCONFIG / NODE_AUTH_TOKEN mechanism)
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}

      - name: Verify Module + Build mode
        run: |
          echo "mt-ci | Module: $MODULE | Build mode: $BUILD_MODE"

      - name: Install dependencies 🔧
        run: bun install --frozen-lockfile

      - name: Release 📦
        run: sh ./scripts/release.sh $MODULE $BUILD_MODE
